name: RevenueOS Quality & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-django

      - name: Backend Ruff Linter
        run: ruff check backend/

      - name: Backend Mypy Static Type Checker
        run: |
          PYTHONPATH=backend mypy --config-file backend/pyproject.toml backend/apps backend/revenueos

      - name: Backend Test Suite (Pytest)
        run: |
          PYTHONPATH=backend pytest backend/tests/

  frontend-quality:
    name: Frontend Lint, Types & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Static Type Checker
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_ORIGIN: https://api.revenueos.live
          NEXT_PUBLIC_WS_URL: wss://api.revenueos.live/ws/v1/app/

  security-and-compliance:
    name: Zero Emojis & Security Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Zero Emojis Across Entire Repository
        run: |
          python3 -c '
          import os, sys
          found = False
          for root, dirs, files in os.walk("."):
              if any(ignored in root for ignored in [".git", "node_modules", ".venv", ".next", ".mypy_cache", ".ruff_cache", ".pytest_cache"]):
                  continue
              for f in files:
                  path = os.path.join(root, f)
                  with open(path, "r", encoding="utf-8", errors="ignore") as file:
                      content = file.read()
                      for char in content:
                          code = ord(char)
                          if (0x1F600 <= code <= 0x1F64F) or \
                             (0x1F300 <= code <= 0x1F5FF) or \
                             (0x1F680 <= code <= 0x1F6FF) or \
                             (0x1F700 <= code <= 0x1F77F) or \
                             (0x1F780 <= code <= 0x1F7FF) or \
                             (0x1F800 <= code <= 0x1F8FF) or \
                             (0x1F900 <= code <= 0x1F9FF) or \
                             (0x1FA00 <= code <= 0x1FA6F) or \
                             (0x1FA70 <= code <= 0x1FAFF) or \
                             (0x2600 <= code <= 0x26FF) or \
                             (0x2700 <= code <= 0x27BF):
                              print(f"Error: Emoji found in {path}: {char} (U+{code:04X})")
                              found = True
          if found:
              sys.exit(1)
          print("Zero emojis found across all repository files.")
          '
